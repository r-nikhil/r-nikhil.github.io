name: Build and deploy site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
        with:
          path: _site

  # Deploys only once the repository variable PAGES_VIA_ACTIONS is 'true' and Pages is set to build from Actions.
  # Until then GitHub's built-in Pages build publishes the site and this workflow only checks that it builds.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
