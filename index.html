---
layout: default
---

<section class="home-content">
<div class="posts">
<div class="category-filter">
  <button class="filter-btn active" data-category="all" aria-pressed="true">All</button>
  <button class="filter-btn" data-category="ai" aria-pressed="false">AI</button>
  <button class="filter-btn" data-category="poker" aria-pressed="false">Poker</button>
  <button class="filter-btn" data-category="crypto" aria-pressed="false">Crypto</button>
  <button class="filter-btn" data-category="personal" aria-pressed="false">Personal</button>
  <button class="filter-btn" data-category="markets" aria-pressed="false">Markets</button>
  <button class="filter-btn" data-category="security" aria-pressed="false">Security</button>
</div>


<ul>
{% for post in site.posts %}
<li class="post-item" data-categories="{% if post.categories %}{{ post.categories | join: ' ' }}{% endif %}">
  <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
  <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b '%y" }}</time>
</li>
{% endfor %}
</ul>
</div>
</section>

<style>

:root {
  --home-paper: #f9fbfd;
  --home-ink: #17202a;
  --home-cobalt: #1456d9;
  --home-cobalt-dark: #0c3ba1;
  --home-cobalt-soft: #e8f2ff;
  --home-grid-rule: #c8d6e1;
}

body {
  color: var(--home-ink);
  background-color: var(--home-paper);
}

main {
  background-color: var(--home-paper);
}

header nav ul {
  border-right-color: var(--home-grid-rule);
}

header a,
.home-content a {
  color: var(--home-cobalt);
}

header a:hover,
.home-content a:hover {
  color: var(--home-cobalt-dark);
  background-color: var(--home-cobalt-soft);
}

.category-filter {
  width: 100%;
  margin: 5px 0 1rem;
  background-color: var(--home-paper);
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}
.filter-btn {
  text-align: center;
  border: 1px solid var(--home-grid-rule);
  border-radius: 999px;
  display: block;
  font-weight: 700;
  padding: 4px 12px;
  transition: all 0.2s ease;
  background: none;
  color: var(--text-color);
  cursor: pointer;
  flex: 0 0 auto;
  min-width: 0;
}
.filter-btn:hover {
  transform: translateY(-1px);
  box-shadow: 2px 2px 0 0 var(--home-cobalt);
  background-color: var(--home-cobalt-soft);
  color: var(--home-cobalt-dark);
}
.filter-btn.active {
  background-color: var(--home-cobalt);
  border-color: var(--home-cobalt);
  color: #fff;
  box-shadow: none;
}
.posts li a {
  color: var(--home-cobalt);
}
.posts li a:hover {
  color: var(--home-cobalt-dark);
}
.posts li time {
  color: #66717d;
  font-weight: 400;
  letter-spacing: 0.01em;
}
.post-item.hidden {
  display: none;
}

@media screen and (max-width: 45rem) {
  header ul {
    border-bottom: 0;
    padding-bottom: 0;
    margin-bottom: 0;
  }

  .category-filter {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    margin-right: -0.75rem;
    padding-right: 0.75rem;
    -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent);
    mask-image: linear-gradient(90deg, #000 85%, transparent);
  }

  .category-filter::-webkit-scrollbar {
    display: none;
  }

  .posts ul {
    border-top: 1px solid var(--home-grid-rule);
  }

  .posts li.post-item {
    display: grid;
    grid-template-columns: 3.6rem minmax(0, 1fr);
    gap: 0.75rem;
    align-items: baseline;
    margin: 0;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--home-grid-rule);
  }

  .posts li.post-item.hidden {
    display: none;
  }

  .posts li.post-item a {
    font-size: 0.9rem;
    line-height: 1.4;
    white-space: normal;
  }

  .posts li.post-item time {
    order: -1;
    margin: 0;
    padding: 0;
    font-size: 0.75rem;
    color: #7a8794;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const filterButtons = document.querySelectorAll('.filter-btn');
  const posts = document.querySelectorAll('.post-item');
  
  filterButtons.forEach(button => {
    button.addEventListener('click', () => {
      const category = button.dataset.category;
      
      filterButtons.forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      });
      button.classList.add('active');
      button.setAttribute('aria-pressed', 'true');
      
      posts.forEach(post => {
        const categories = post.dataset.categories.split(' ');
        if (category === 'all' || categories.includes(category)) {
          post.classList.remove('hidden');
        } else {
          post.classList.add('hidden');
        }
      });
    });
  });
});
</script>
