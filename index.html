---
layout: default
---

<div class="sec gap" aria-hidden="true"></div>
{% assign years = site.posts | group_by_exp: "p", "p.date | date: '%Y'" %}
{% for y in years %}
<section class="sec year" style="--n:{{ forloop.index }}">
  <h2>{{ y.name }}</h2>
  <ul class="body rows">
    {% for post in y.items %}<li><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></li>
    {% endfor %}
  </ul>
</section>
{% endfor %}
