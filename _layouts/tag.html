---
layout: default
---

<section class="sec">
  <h1>#{{ page.tag }}</h1>
  <ul class="body rows">
    {% for post in site.posts %}{% if post.tags contains page.tag %}<li><a href="{{ post.url }}">{{ post.title }}</a><time class="d" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %Y" }}</time></li>{% endif %}{% endfor %}
  </ul>
</section>
