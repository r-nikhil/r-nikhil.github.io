---
layout: default
---

<section>
<h1>Tag #{{page.tag}}</h1>
    <ul class="list">
      {% for post in site.posts %}
      {% if post.tags contains page.tag %}
      <li><a class="post" href="{{ post.url }}"><span class="row"><span class="t">{{ post.title }}</span></span><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b '%y" }}</time></a></li>
      {% endif %}
      {% endfor %}
    </ul>
	
</section>
